<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-SEJARAH BALING - Ekosistem Digital Panitia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Pustaka Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col md:flex-row">

    <!-- MODAL LOG MASUK -->
    <div id="loginModal" class="fixed inset-0 bg-slate-900/80 z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl border border-slate-100">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-emerald-100 text-emerald-800 rounded-2xl flex items-center justify-center mx-auto text-2xl font-black mb-3">
                    <i class="fa-solid fa-landmark"></i>
                </div>
                <h2 class="text-2xl font-extrabold text-slate-900">e-SEJARAH BALING</h2>
                <p class="text-xs text-slate-500 mt-1">Pusat Digital Panitia Sejarah Daerah Baling</p>
            </div>
            
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Peranan Akses</label>
                    <select id="loginRole" onchange="toggleSchoolSelectField()" class="w-full text-xs font-semibold p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-600 focus:outline-none">
                        <option value="KETUA_PANITIA">Ketua Panitia / Guru Sekolah</option>
                        <option value="ADMIN">Admin Daerah / SISC+</option>
                    </select>
                </div>

                <div id="schoolSelectWrapper">
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Pilih Sekolah Anda</label>
                    <select id="loginSchool" class="w-full text-xs font-semibold p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-600 focus:outline-none">
                        <option value="SEKOLAH MENENGAH KEBANGSAAN TUNKU PUTERA">SEKOLAH MENENGAH KEBANGSAAN TUNKU PUTERA</option>
                        <option value="SEKOLAH MENENGAH KEBANGSAAN BALING">SEKOLAH MENENGAH KEBANGSAAN BALING</option>
                        <option value="SK BALING">SK BALING</option>
                        <option value="SEKOLAH KEBANGSAAN KUPANG">SEKOLAH KEBANGSAAN KUPANG</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Kata Laluan</label>
                    <input type="password" id="loginPasswordInput" value="123456" required class="w-full text-xs p-3 border border-slate-200 rounded-xl">
                </div>

                <button type="submit" class="w-full bg-emerald-800 text-white font-bold py-3.5 rounded-xl text-xs hover:bg-emerald-900 transition">
                    LOG MASUK KE SISTEM ONLINE
                </button>
            </form>
        </div>
    </div>

    <!-- NAVIGASI TEPI -->
    <aside id="sidebarMenu" class="w-full md:w-64 bg-slate-900 text-slate-300 p-5 flex-col justify-between shrink-0 hidden md:flex">
        <div>
            <div class="flex items-center space-x-3 mb-8 px-2">
                <div class="w-10 h-10 bg-emerald-600 text-amber-300 rounded-xl flex items-center justify-center text-lg font-black">
                    <i class="fa-solid fa-landmark"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm text-white">e-SEJARAH BALING</h1>
                    <p class="text-[10px] text-emerald-400 font-medium">Sistem Awan Terhubung</p>
                </div>
            </div>

            <nav class="space-y-1.5 text-xs font-medium">
                <button onclick="switchTab('senarai-opr')" id="nav-senarai-opr" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl bg-emerald-800 text-white">
                    <i class="fa-solid fa-list-check w-5"></i> <span>Senarai OPR (Live)</span>
                </button>
            </nav>
        </div>
    </aside>

    <!-- RUANG KANDUNGAN -->
    <main class="flex-1 p-4 md:p-8 overflow-y-auto max-w-7xl mx-auto w-full">
        <section id="tab-senarai-opr" class="space-y-6">
            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-6">
                <div class="flex justify-between items-center border-b pb-4">
                    <div>
                        <h3 class="font-black text-slate-900 text-base">📋 LAPORAN OPR DAERAH (REALTIME)</h3>
                        <p class="text-xs text-slate-500 mt-1">Satu cikgu isi, semua cikgu daerah Baling boleh terus nampak!</p>
                    </div>
                    <button onclick="openOprModal()" class="bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow">
                        ➕ JANA OPR BAHARU
                    </button>
                </div>

                <div id="oprRecordsContainer" class="space-y-4">
                    <p class="text-xs text-slate-400 italic">Memuatkan data secara atas talian...</p>
                </div>
            </div>
        </section>
    </main>

    <!-- MODAL BORANG OPR -->
    <div id="oprModal" class="fixed inset-0 bg-slate-900/80 z-[120] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-xl w-full p-6 relative text-xs space-y-4 shadow-2xl">
            <button onclick="closeOprModal()" class="absolute right-5 top-5 text-slate-400 font-bold"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="font-extrabold text-slate-900 text-base">Tambah Laporan OPR Online</h3>

            <form onsubmit="handleOprSubmit(event)" class="space-y-3">
                <div>
                    <label class="block font-bold text-slate-800 mb-1">Nama Program *</label>
                    <input type="text" id="oprNamaProgram" required class="w-full p-2.5 border rounded-xl">
                </div>
                <div>
                    <label class="block font-bold text-slate-800 mb-1">Tarikh & Tempat *</label>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="date" id="oprTarikh" required class="p-2.5 border rounded-xl">
                        <input type="text" id="oprTempat" placeholder="Lokasi" required class="p-2.5 border rounded-xl">
                    </div>
                </div>
                <div>
                    <label class="block font-bold text-slate-800 mb-1">Pelaporan Ringkas *</label>
                    <textarea id="oprPelaporan" rows="3" required class="w-full p-2.5 border rounded-xl"></textarea>
                </div>
                <button type="submit" id="btnSubmitOpr" class="w-full bg-emerald-800 text-white font-bold py-3 rounded-xl hover:bg-emerald-900">
                    SIMPAN KE AWAN (KONGSI KEPADA SEMUA GURU)
                </button>
            </form>
        </div>
    </div>

    <script>
        // TETAPAN SUPABASE PROJEK ANDA
        const SUPABASE_URL = "https://lluwzqaklkmuzgepkkza.supabase.co";
        
        // Klik butang copy pada 'Publishable key' di skrin anda dan gantikan di bawah:
        const SUPABASE_ANON_KEY = "SALIN_DAN_PASTE_PUBLISHABLE_KEY_DI_SINI";

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = { role: 'KETUA_PANITIA', sekolah: 'SK BALING' };

        window.onload = function() {
            loadOprRecordsRealtime();
        };

        function handleLogin(e) {
            e.preventDefault();
            const role = document.getElementById('loginRole').value;
            currentUser.role = role;
            currentUser.sekolah = role === 'KETUA_PANITIA' ? document.getElementById('loginSchool').value : 'ADMIN DAERAH';
            document.getElementById('loginModal').classList.add('hidden');
            loadOprRecordsRealtime();
        }

        // FUNGSI MEMBACA DATA DARI AWAN
        async function loadOprRecordsRealtime() {
            const container = document.getElementById('oprRecordsContainer');
            
            const { data, error } = await supabase
                .from('opr_records')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                container.innerHTML = `<p class="text-xs text-rose-500">Ralat memuatkan data. Sila semak sambungan internet.</p>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 italic">Tiada rekod OPR dijumpai. Sila klik 'JANA OPR BAHARU'.</p>`;
                return;
            }

            container.innerHTML = data.map(item => `
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 flex justify-between items-center">
                    <div>
                        <span class="text-[10px] font-bold bg-rose-100 text-rose-800 px-2 py-0.5 rounded-full">${item.tarikh}</span>
                        <h4 class="font-bold text-slate-900 text-xs mt-1">${item.nama_program}</h4>
                        <p class="text-[10px] text-slate-500">${item.sekolah} • ${item.tempat}</p>
                        <p class="text-xs text-slate-600 mt-1 italic">"${item.pelaporan}"</p>
                    </div>
                    ${currentUser.role === 'ADMIN' ? `<button onclick="deleteOprRecord(${item.id})" class="bg-rose-600 text-white text-[10px] font-bold px-2.5 py-1 rounded-lg">Padam</button>` : ''}
                </div>
            `).join('');
        }

        // FUNGSI MENYIMPAN DATA KE AWAN
        async function handleOprSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitOpr');
            btn.innerText = "Menyimpan ke Awan...";
            btn.disabled = true;

            const newRecord = {
                nama_program: document.getElementById('oprNamaProgram').value,
                tarikh: document.getElementById('oprTarikh').value,
                tempat: document.getElementById('oprTempat').value,
                pelaporan: document.getElementById('oprPelaporan').value,
                sekolah: currentUser.sekolah
            };

            const { error } = await supabase.from('opr_records').insert([newRecord]);

            if (error) {
                alert("Gagal menyimpan data: " + error.message);
            } else {
                alert("Laporan OPR berjaya disimpan! Semua guru kini boleh melihat laporan ini.");
                closeOprModal();
                loadOprRecordsRealtime();
            }

            btn.innerText = "SIMPAN KE AWAN (KONGSI KEPADA SEMUA GURU)";
            btn.disabled = false;
        }

        async function deleteOprRecord(id) {
            if(confirm("Adakah anda pasti untuk memadam rekod OPR ini?")) {
                await supabase.from('opr_records').delete().eq('id', id);
                loadOprRecordsRealtime();
            }
        }

        function openOprModal() { document.getElementById('oprModal').classList.remove('hidden'); }
        function closeOprModal() { document.getElementById('oprModal').classList.add('hidden'); }
        function toggleSchoolSelectField() {
            document.getElementById('schoolSelectWrapper').style.display = document.getElementById('loginRole').value === 'ADMIN' ? 'none' : 'block';
        }
    </script>
</body>
</html>
